const ASU=[[["서두른 열정은 쉽게 식어요. 한 템포 쉬었다 가요.","불꽃을 아끼고, 오늘은 정리부터 해 보세요.","화를 내기 전에 숨을 크게 한 번 쉬어 보세요."],["하고 싶은 일 하나만 골라 가볍게 시작해 보세요.","의욕이 올라오는 쪽으로 천천히 움직여 보세요.","무리 없는 속도로 꾸준히 가면 충분해요."],["열정이 큰 힘이 돼요. 망설이던 일을 시작해 보세요.","몸을 움직이면 운도 따라와요. 먼저 행동해 보세요.","지금의 에너지를 믿고 한 걸음 크게 내디뎌 보세요."]],[["서운한 마음은 말로 꺼내야 풀려요. 천천히 이야기해 보세요.","감정이 가라앉을 때까지 큰 결정은 미뤄 두세요.","마음이 지칠 땐 혼자 삭이지 말고 털어놓아 보세요."],["마음이 가는 사람에게 안부를 먼저 전해 보세요.","좋아하는 차 한 잔으로 감정을 부드럽게 달래 보세요.","오늘의 기분을 한 줄로 적어 보세요."],["따뜻한 마음이 오가는 때예요. 고마움을 표현해 보세요.","좋은 사람들과의 시간이 큰 힘이 돼요.","마음을 열면 기쁜 일이 더 크게 돌아와요."]],[["머릿속 걱정을 종이에 적으면 절반은 가벼워져요.","날 선 말은 잠시 삼키고 한 번 더 생각해 보세요.","혼자 생각을 돌리지 말고 믿는 사람에게 물어보세요."],["사실과 느낌을 나눠서 차분히 정리해 보세요.","결정 전에 필요한 정보를 하나만 더 확인해 보세요.","생각이 복잡할 땐 산책으로 머리를 비워 보세요."],["판단이 또렷해지는 때예요. 미뤄 둔 결정을 내려 보세요.","솔직한 대화가 오해를 풀어 줄 거예요.","생각을 말로 정리해 보면 길이 선명해져요."]],[["지출과 일정을 한 번 점검하면 불안이 줄어요.","급한 결정 대신 계산을 한 번 더 해 보세요.","무리한 약속은 줄이고 쉴 틈을 만들어 보세요."],["작은 습관 하나를 꾸준히 이어 가 보세요.","가진 것을 정리하면 필요한 것이 보여요.","천천히 쌓는 것이 가장 단단해요."],["성실함이 결실로 돌아와요. 계획대로 밀고 가도 좋아요.","착실히 쌓은 것을 믿고 한 단계 올려 보세요.","수확을 즐기되 조금은 나눠 보세요."]]];
const MN=[
[["작은 불씨가 켜졌어요. 떠오른 아이디어를 오늘 적어 두세요.","시작이 늦어져도 괜찮아요. 불씨가 꺼지지 않게 준비만 해 두세요."],["갈림길에 서 있어요. 원하는 쪽을 종이에 적어 비교해 보세요.","두려움이 발목을 잡고 있어요. 가장 작은 한 걸음부터 떼어 봐요."],["멀리 보내 둔 노력이 돌아오는 때예요. 시야를 넓혀 보세요.","기다리는 소식이 늦어지고 있어요. 재촉보다 다른 준비를 해 봐요."],["함께 기뻐할 일이 있어요. 가까운 사람들과 축하를 나눠 보세요.","집 안팎의 분위기가 흔들려요. 따뜻한 말 한마디가 도움이 돼요."],["의견이 부딪혀도 성장의 과정이에요. 이기려 하지 말고 들어 보세요.","다툼이 가라앉고 있어요. 먼저 손을 내밀면 관계가 풀려요."],["노력을 인정받는 때예요. 스스로에게도 박수를 보내 주세요.","자신감이 잠시 꺾였어요. 지난 성과를 떠올리며 다시 일어서 봐요."],["지켜야 할 것이 있다면 물러서지 말아요. 내 자리를 믿어 보세요.","모든 걸 혼자 막아 내지 않아도 돼요. 도움을 청해 보세요."],["일이 빠르게 움직여요. 연락과 답장을 미루지 말아 보세요.","속도가 어긋나는 때예요. 확인 한 번이 실수를 막아 줘요."],["마지막 고비예요. 조금만 더 버티면 끝이 보여요.","많이 지쳤어요. 오늘만큼은 푹 쉬고 내일 다시 생각해요."],["짊어진 짐이 크지만 나눠 질 수 있어요. 우선순위를 정리해 보세요.","내려놓아도 되는 짐을 구분해 보세요. 한결 가벼워질 거예요."],["새로운 소식이 곧 와요. 호기심을 열어 두고 가볍게 알아봐요.","서두른 시작은 헛걸음이 되기 쉬워요. 준비 목록부터 확인해요."],["마음이 달아오르는 때예요. 열정을 행동으로 옮겨 보세요.","충동이 앞서는 때예요. 말하거나 결정하기 전에 하룻밤 두고 봐요."],["당신의 매력이 빛나요. 자신 있게 앞에 나서 보세요.","비교하는 마음을 잠시 내려놓아요. 내 속도만 보면 돼요."],["방향을 정하고 이끌어 갈 때예요. 비전을 사람들에게 들려주세요.","내 방식만 고집하고 있진 않은지 돌아보고, 의견을 구해 보세요."]],
[["마음에 사랑이 차오르고 있어요. 그 감정을 소중히 받아들여 보세요.","마음이 비어 있다고 느낄 수 있어요. 나를 위한 작은 선물을 해 보세요."],["마음이 서로 닿는 때예요. 진심 어린 대화를 나눠 보세요.","서로의 마음이 어긋나고 있어요. 솔직한 한마디가 필요해요."],["친구들과 어울리며 웃을 일이 생겨요. 모임에 먼저 얼굴을 비춰요.","어울림이 지나치지 않게 해요. 소문과 과한 즐거움은 한 걸음 물러나요."],["눈앞의 것이 시들하다면 쉬어 가요. 마음이 끌리는 쪽을 살펴보세요.","닫혀 있던 마음이 열려요. 새로 오는 기회를 받아들여 봐요."],["잃은 것이 아쉬워도 아직 남은 컵이 있어요. 그쪽을 돌아봐요.","상처가 아물기 시작해요. 천천히 앞으로 걸어가 보세요."],["따뜻한 기억이 힘이 돼요. 오랜 인연에게 안부를 건네 보세요.","과거에만 머물러 있지는 않은지 살펴봐요. 지금 이 순간도 소중해요."],["선택지가 많아 헷갈려요. 현실에서 가능한 것부터 추려 보세요.","환상이 걷히고 현실이 보여요. 정말 원하는 것 하나를 골라요."],["떠날 때가 되었다고 마음이 말해요. 아쉬움은 안고 가도 괜찮아요.","미련 때문에 머물고 있어요. 남을 이유와 떠날 이유를 적어 봐요."],["소원이 이뤄지는 만족의 때예요. 지금의 행복을 마음껏 누려요.","더 가지려는 마음이 커졌어요. 이미 가진 것을 먼저 세어 봐요."],["마음 편한 사람들과 보내는 시간이 최고의 선물이에요.","가까운 사이에도 균열이 생길 수 있어요. 오늘 저녁은 함께 식사해 봐요."],["설레는 소식이 올 수 있어요. 마음을 열고 기다려 보세요.","감정을 표현하는 게 서툴러요. 편지나 메시지로 천천히 전해 봐요."],["로맨틱한 제안이 올 수 있어요. 진심이 담겼는지 살펴보세요.","기분이 오르락내리락해요. 큰 약속은 기분이 안정된 뒤에 해요."],["깊은 공감이 힘이 돼요. 곁의 사람 이야기에 귀 기울여 보세요.","남의 감정에 휩쓸리고 있어요. 내 마음의 경계를 지켜 주세요."],["감정을 다스릴 여유가 있어요. 한 박자 느리게 대답해 보세요.","참아 온 감정이 터질 수 있어요. 일기나 운동으로 먼저 풀어 줘요."]],
[["진실이 선명해져요. 미뤄 둔 결정을 용기 내어 내려 보세요.","생각이 뒤엉켜 있어요. 결정은 정보를 더 모은 뒤로 미뤄요."],["양쪽 사이에서 망설이고 있어요. 어느 쪽이 더 편한지 조용히 느껴 보세요.","눈을 가리고 있던 것이 벗겨져요. 숨은 사실을 마주해 보세요."],["가슴 아픈 일이 있어도 괜찮아요. 슬픔을 충분히 느끼게 해 주세요.","상처가 서서히 아물어요. 스스로를 다독이며 쉬어 가요."],["쉬는 것도 일이에요. 오늘은 아무 계획 없이 푹 쉬어요.","충분히 쉬었어요. 이제 천천히 다시 움직일 준비를 해요."],["이기는 것보다 지키는 것이 중요해요. 싸움에서 한 발 물러나 봐요.","다툼의 상처를 돌아보게 돼요. 화해의 말을 먼저 건네 보세요."],["무거운 일에서 벗어나 잔잔한 곳으로 가고 있어요. 천천히 가면 돼요.","떠나지 못하고 있어요. 작은 변화 하나라도 실행해 보세요."],["숨은 속셈이 있을 수 있어요. 계약과 약속은 꼼꼼히 확인해요.","감춘 일이 드러나요. 먼저 솔직하게 털어놓으면 마음이 편해져요."],["스스로 만든 생각의 벽이 있어요. 문은 생각보다 가까이에 있어요.","묶인 줄이 풀리고 있어요. 첫걸음을 내디뎌 보세요."],["밤새 이어지는 걱정은 실제보다 커 보여요. 따뜻한 물 한 잔 마셔요.","걱정이 서서히 줄어들어요. 마음을 믿어 주고 푹 자 보세요."],["가장 힘든 지점을 지났어요. 이제 올라갈 일만 남았어요.","회복이 시작되었어요. 새로운 시작을 위해 숨을 고르세요."],["호기심이 길을 열어 줘요. 궁금한 것을 직접 물어보세요.","말이 앞서가기 쉬워요. 보내기 전에 한 번 더 읽어 보세요."],["망설임 없이 움직일 때예요. 방향만 맞다면 속도를 내 보세요.","성급하게 달려가고 있어요. 한 번 멈춰서 지도를 확인해요."],["솔직하고 분명한 말이 힘이 돼요. 돌려 말하지 않아도 괜찮아요.","차가운 말투가 상처가 될 수 있어요. 온도만 조금 높여 보세요."],["냉정한 판단이 필요한 때예요. 감정을 잠시 두고 사실만 보세요.","지나치게 엄격하진 않은가요? 가까운 사람에게 부드럽게 대해 보세요."]],
[["현실적인 기회가 손에 잡혀요. 놓치지 말고 작게라도 시작해요.","기회를 놓쳤어도 괜찮아요. 다음 기회를 위한 준비는 지금도 할 수 있어요."],["여러 일을 저글링하는 때예요. 우선순위 세 가지만 정해 보세요.","일이 너무 많아졌어요. 부탁하거나 미룰 수 있는 것을 골라 봐요."],["함께하면 더 큰 결과가 나와요. 팀과 역할을 나눠 보세요.","손발이 맞지 않아요. 기대와 역할을 다시 한번 말로 맞춰 봐요."],["지킬 것을 지키는 건 좋아요. 다만 가끔은 숨통도 틔워 줘요.","너무 꽉 쥐고 있진 않은가요? 조금 놓아도 사라지지 않아요."],["형편이 빠듯해도 곁에 도움의 문이 있어요. 용기 내어 두드려 봐요.","어려움의 끝이 보여요. 조금씩 회복하는 속도를 믿어 보세요."],["나누면 균형이 맞춰져요. 작은 친절을 베풀어 보세요.","주고받는 게 한쪽으로 기울었어요. 서로의 몫을 다시 이야기해요."],["씨앗을 뿌린 뒤엔 기다림이 필요해요. 조급해하지 않아도 자라요.","결과가 늦어 초조해요. 성급히 바꾸기보다 점검만 해 보세요."],["한 가지를 꾸준히 갈고닦아 보세요. 기술이 쌓이면 자신감이 돼요.","대충 넘기는 습관이 보여요. 오늘 하나만 정성껏 마무리해요."],["스스로 이룬 여유를 누려도 좋아요. 나를 위한 작은 보상을 해 줘요.","쓰는 것에 휩쓸리기 쉬워요. 큰 소비는 하룻밤 생각해 봐요."],["오래 이어질 안정이 만들어져요. 소중한 사람들과 기쁨을 나눠 보세요.","기반이 흔들리는 느낌이에요. 가장 중요한 한 가지부터 점검해요."],["배움의 자세가 행운을 불러요. 모르는 것을 묻는 용기를 내 봐요.","시작을 자꾸 미루고 있어요. 오 분만 투자해서 첫 장만 열어 봐요."],["느려 보여도 꾸준함이 가장 빨라요. 오늘 할 몫만 해내요.","같은 자리에 머문 느낌이에요. 방법을 하나만 바꿔 보세요."],["주변을 돌보는 마음이 풍요를 불러요. 나 자신도 함께 챙겨 주세요.","나를 돌보는 일을 소홀히 했어요. 오늘은 나부터 챙겨요."],["든든한 기반이 있어요. 가진 것을 지혜롭게 운영해 보세요.","지나치게 아끼고 있진 않나요? 필요한 곳에는 너그러워져도 좋아요."]]
].flat();
const LD=[["지난 시간 동안 당신은 §의 영향 아래에 있었어요.","돌아보면 한동안 §의 기운이 당신 곁을 맴돌았어요.","지나온 길에는 §의 흔적이 남아 있어요.","과거의 당신은 §의 한가운데에서 많은 것을 겪었어요.","이전의 시간은 §에서 시작된 이야기였어요.","어느새 지나간 날들 속에 §의 장면이 있었어요.","지금의 당신은 §의 시간을 지나 이 자리에 왔어요.","과거에는 §의 힘이 크게 작용했어요."],["지금 당신은 §의 한가운데에 서 있어요.","오늘의 당신 곁에는 §의 기운이 머물고 있어요.","지금 이 순간, §의 장면이 당신 앞에 펼쳐져 있어요.","현재 당신의 하루에는 §의 색이 스며 있어요.","지금의 흐름은 §에서 비롯되고 있어요.","바로 지금, §의 시간이 당신을 지나고 있어요.","요즘 당신의 마음속에는 §의 이야기가 자리하고 있어요.","현재는 §의 영향이 가장 크게 느껴지는 때예요."],["앞으로 §의 기운이 다가올 거예요.","머지않아 §의 장면이 당신 앞에 펼쳐질 거예요.","다가오는 시간에는 §의 순간이 기다리고 있어요.","곧 §의 흐름이 당신을 찾아올 거예요.","미래의 당신은 §에서 새로운 의미를 발견하게 될 거예요.","앞으로의 길 끝에는 §의 모습이 보여요.","시간이 흐르면 §의 기운이 서서히 짙어질 거예요.","곧 다가올 날들은 §의 색을 띠고 있어요."]];
function lead(c,k){return LD[k][(c.i+(c.rev?3:0)+k*2)%8].replace("§",c.phrase);}
function adv(c,k){
  if(c.i<22)return AM[c.i][c.rev?1:0];
  return MN[c.i-22][c.rev?1:0];
}
const PAT=[["지금이 가장 힘든 지점이에요. 이 구간만 지나면 흐름이 다시 올라가요.","현재가 잠시 움푹 들어간 자리예요. 바닥을 지나는 중이라 생각하면 마음이 가벼워져요.","지금은 쉬어 가는 골짜기 같아요. 너무 애쓰지 않아도 괜찮아요."],["지금이 이야기의 정점이에요. 가진 힘을 가장 잘 쓸 수 있는 때예요.","현재가 가장 빛나는 순간이에요. 이 기회를 놓치지 않으면 좋겠어요.","지금 이 시간이 흐름의 가장 높은 곳이에요. 자신감을 가져도 좋아요."],["시간이 갈수록 기운이 오르는 흐름이에요. 지금의 노력이 앞으로 보상받을 거예요.","점점 나아지는 모양새예요. 조급해하지 않아도 길이 열릴 거예요.","과거보다 미래가 더 밝은 배치예요. 꾸준함이 힘이 돼 줄 거예요."],["앞으로 갈수록 조심할 일이 늘어나는 흐름이에요. 미리 준비하면 충분히 넘길 수 있어요.","미래 쪽 기운이 조금 무거워요. 하나씩 점검하면서 가면 괜찮아요.","지금까지의 좋은 기운을 아껴 쓰라는 신호예요. 욕심을 줄이면 안전해요."],["세 장 모두 따뜻한 기운을 품고 있어요. 지금 가는 길을 믿어도 좋아요.","과거와 현재, 미래가 고르게 밝아요. 보기 드물게 안정적인 배치예요.","흐름이 전체적으로 맑아요. 마음 편히 한 걸음씩 나아가 보세요."],["조금 버거운 시기가 이어지는 배치예요. 그래도 카드는 경고보다 쉼표에 가까워요.","전체적으로 무거운 기운이에요. 스스로를 먼저 돌보면 흐름이 달라져요.","힘든 카드가 모였지만 바꿀 수 없는 운명은 아니에요. 작은 것부터 정리해 보세요."],["좋은 기운과 조심할 기운이 고르게 섞여 있어요. 균형을 잡는 게 핵심이에요.","기복이 있지만 나쁘지 않은 흐름이에요. 차분히 선택하면 좋은 결과가 있을 거예요.","여러 감정이 교차하는 배치예요. 서두르지 말고 하나씩 살펴보세요."]];
const CLOSE=[["오늘은 스스로에게 조금 다정해져 보세요.","작은 휴식이 큰 변화를 만들 수 있어요.","혼자 끌어안지 말고 가까운 사람에게 이야기해 보세요."],["차분히 한 가지씩 선택해 나가면 돼요.","균형을 잃지 않는 것이 가장 큰 무기예요.","직감과 현실 감각을 함께 써 보세요."],["지금의 흐름을 믿고 한 걸음 더 나아가 보세요.","좋은 기운은 나눌수록 커져요. 주변과 함께해 보세요.","하고 싶던 일을 시작하기에 좋은 때예요."]];
const THEME=["완드가 여러 장이라 열정과 행동력이 이번 이야기의 열쇠예요.","컵이 여러 장이라 감정과 관계가 핵심 주제예요.","소드가 여러 장이라 생각과 결정이 중요한 주제예요.","펜타클이 여러 장이라 일상과 재물 같은 현실적인 문제가 중심이에요."];
const LUCK=["작은 용기를 내 보세요.","오늘은 마음 가는 대로 한 걸음.","미뤄 둔 말을 건네 보세요.","잠깐의 휴식이 큰 힘이 돼요.","주변을 정리하면 생각도 정리돼요.","감사한 일 하나를 떠올려 보세요.","서두르지 않는 것이 지름길이에요.","웃을 일을 일부러 만들어 보세요."];
function synth(cs,tot){
  const [a,b,c]=cs,S=cs.map(x=>x.score);
  const h=cs.reduce((s,x,k)=>s+(x.i+3)*(k+2)*(x.rev?5:3),0);
  const pk=(arr,o=0)=>arr[(h+o*7)%arr.length];
  const story=pk([`과거에는 ${a.phrase}, 현재에는 ${b.phrase}, 앞으로는 ${c.phrase}. 세 장면이 이어져 하나의 이야기가 돼요.`,`이야기는 ${a.phrase}에서 시작해 ${b.phrase}까지 이어지고, 끝에는 ${c.phrase}의 모습이 기다리고 있어요.`,`${a.name}, ${b.name}, ${c.name}. 이 세 장은 ${a.phrase}부터 ${c.phrase}까지의 길을 보여줘요.`,`지난날의 ${a.phrase}, 오늘의 ${b.phrase}, 내일의 ${c.phrase}. 하나씩 따라가 보면 지금 서 있는 자리가 보여요.`,`카드가 그리는 흐름은 이래요. ${a.phrase}의 시간을 지나, ${b.phrase}의 한가운데에서, ${c.phrase}의 순간으로 향해요.`]);
  const P=S[1]<S[0]&&S[1]<S[2]?0:S[1]>S[0]&&S[1]>S[2]?1:S[2]>S[0]?2:S[2]<S[0]?3:tot>=5?4:tot<=2?5:6;
  const r=cs.filter(x=>x.rev).length,k=cs.findIndex(x=>x.rev);
  const rv=r==0?"세 장 모두 정방향이라 카드의 메시지가 또렷하게 전해져요.":r==1?`역방향 카드는 ${LAB[k]} 자리에 있어요. 그 시점의 일은 한 번 더 돌아보면 좋겠어요.`:r==2?"역방향이 두 장이에요. 겉으로 보이는 것보다 마음속 이야기에 귀 기울여 보세요.":"세 장 모두 역방향이에요. 지금은 밖보다 안을 살피는 시간이 필요해요.";
  const m=cs.filter(x=>x.i<22).length,cnt=[0,0,0,0];
  cs.forEach(x=>{if(x.i>=22)cnt[Math.floor((x.i-22)/14)]++});
  const ds=cnt.findIndex(n=>n>=2);
  const th=m==3?"세 장 모두 메이저 카드예요. 큰 흐름이 움직이는 아주 드문 배치예요.":m==2?"메이저 카드가 두 장이에요. 인생의 중요한 전환점과 닿아 있는 이야기예요.":ds>=0?THEME[ds]:m==0?"세 장 모두 마이너 카드라 일상 속의 작고 구체적인 이야기에 가까워요.":"";
  const lv=tot<=2?0:tot>=5?2:1;
  return `<p>${story}</p><p>${pk(PAT[P],1)} ${th}</p><p>${rv}</p><p>${pk(CLOSE[lv],2)}</p><p style="color:var(--mut);font-size:14px">🍀 오늘의 한마디: ${pk(LUCK,3)}</p>`;
}

function card(i,rev){
  let p,name;
  if(i<22){p=MAJ[i].split("|");name=p.shift();}
  else{const m=i-22,s=Math.floor(m/14),r=m%14;p=MIN[s][r].split("|");name=SUIT[s]+" "+RANK[r];}
  return {i,name,rev,phrase:rev?p[1]:p[0],score:+p[2][rev?1:0]};
}
function parse(){
  const raw=(location.hash.slice(1)||new URLSearchParams(location.search).get("c")||"").split("-");
  if(raw.length!==3)return null;
  const out=[];
  for(const t of raw){const m=/^(\d{1,2})(r?)$/.exec(t);if(!m||+m[1]>77)return null;out.push(card(+m[1],m[2]==="r"));}
  return out;
}
function render(cs){
  const el=document.getElementById("out");
  if(!cs){el.innerHTML='<div class="card"><p>결과를 읽지 못했어요. QR을 다시 찍거나 아래 버튼으로 테스트해 보세요.</p></div>';return;}
  let h="";
  cs.forEach((c,k)=>{
    h+=`<div class="card"><div class="lab">${LAB[k]}</div><div class="nm">${c.name}<span class="dir">${c.rev?"역방향":"정방향"}</span></div><p>${lead(c,k)}</p><p>${adv(c,k)}</p></div>`;
  });
  const [a,b,c]=cs, tot=a.score+b.score+c.score; const rich=synth(cs,tot);
  const flow=c.score>a.score?"시간이 갈수록 분위기가 나아지는 흐름이에요.":c.score<a.score?"앞으로 조금 더 신중함이 필요한 흐름이에요.":"비슷한 결의 기운이 이어지는 흐름이에요.";
  const end=tot>=5?"전체적으로 밝은 운이에요. 지금의 방향을 믿고 한 걸음씩 나아가 보세요.":tot>=3?"좋은 점과 조심할 점이 함께 있어요. 균형을 잡으며 차분히 나아가면 좋은 결과가 있을 거예요.":"조금 힘든 시기일 수 있지만, 이 흐름은 곧 바뀔 수 있어요. 서두르지 말고 스스로를 먼저 돌봐 주세요.";
  h+=`<div class="card sum"><div class="lab">종합 해석</div>${rich}</div>`;
  el.innerHTML=h;
}
function pick(){
  const s=new Set();while(s.size<3)s.add(Math.floor(Math.random()*78));
  location.hash=[...s].map(n=>n+(Math.random()<.5?"r":"")).join("-");
}
document.getElementById("again").onclick=pick;
window.addEventListener("hashchange",()=>render(parse()));
if(!location.hash&&!location.search)pick();else render(parse());
</script>
